<!doctype html>
<html lang="{{ site.lang | default: 'ko' }}" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% if page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;700;900{% if page.layout == 'post' %}&family=Noto+Serif+KR:wght@400;500;700{% endif %}&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="{{ '/site.css' | relative_url }}" />
</head>
<body>

  <!-- mouse-follow cursor (hidden on touch via CSS) -->
  <div class="cursor" aria-hidden="true"></div>

  <!-- shooting stars overlay -->
  <div class="shooting-stars" aria-hidden="true">
    <span class="shoot s1"></span>
    <span class="shoot s2"></span>
    <span class="shoot s3"></span>
    <span class="shoot s4"></span>
    <span class="shoot s5"></span>
  </div>

  {% include sidebar.html %}

  <main class="main">
    {{ content }}
  </main>

  <script src="{{ '/site.js' | relative_url }}"></script>
</body>
</html>
