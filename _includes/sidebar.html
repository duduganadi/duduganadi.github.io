<!-- Shared sidebar.
     Pass `page.nav` from each page to highlight the current item — values:
     "hero" "about" "projects" "experience" "skills" "blog" "contact". -->
<aside class="sidebar" aria-label="사이트 정보">
  <div class="sb-top">
    <a href="{{ '/' | relative_url }}" class="brand">
      <span>du</span><span class="brand-dot">.</span><span>ganadi</span>
    </a>
    <button class="theme-toggle" type="button" aria-label="라이트 모드로 전환">
      <span class="theme-icon" aria-hidden="true"></span>
      <span class="theme-label">DARK</span>
    </button>
  </div>

  <div class="sb-bio">
    <div class="kicker">Currently</div>
    <p>한 줄 소개를 적어보세요.</p>
  </div>

  <nav class="sb-nav" aria-label="섹션">
    {%- assign cur = page.nav | default: "" -%}
    <a href="{{ '/#hero'        | relative_url }}" data-num="01"{% if cur == 'hero'        %} class="is-current"{% endif %}>Index</a>
    <a href="{{ '/#about'       | relative_url }}" data-num="02"{% if cur == 'about'       %} class="is-current"{% endif %}>About</a>
    <a href="{{ '/#projects'    | relative_url }}" data-num="03"{% if cur == 'projects'    %} class="is-current"{% endif %}>Projects</a>
    <a href="{{ '/#experience'  | relative_url }}" data-num="04"{% if cur == 'experience'  %} class="is-current"{% endif %}>Experience</a>
    <a href="{{ '/#skills'      | relative_url }}" data-num="05"{% if cur == 'skills'      %} class="is-current"{% endif %}>Skills</a>
    <a href="{{ '/blog.html'    | relative_url }}" data-num="06"{% if cur == 'blog'        %} class="is-current"{% endif %}>블로그</a>
    <a href="{{ '/#contact'     | relative_url }}" data-num="07"{% if cur == 'contact'     %} class="is-current"{% endif %}>Contact</a>
  </nav>

  <div class="sb-spacer"></div>

  <div class="sb-social">
    <div class="kicker">Elsewhere</div>
    <ul>
      <li><span>GitHub</span><a href="https://github.com/duganadi" class="link">@duganadi</a></li>
      <li><span>Email</span><a href="mailto:lalala433@naver.com" class="link">lalala433@naver.com</a></li>
      <li><span>Phone</span><a href="tel:+821029022464" class="link">010-2902-2464</a></li>
      <li><span>Blog</span><a href="{{ '/blog.html' | relative_url }}" class="link">duganadi.dev</a></li>
    </ul>
  </div>

  <div class="sb-foot">© 2026 · 김해 · KST</div>
</aside>
